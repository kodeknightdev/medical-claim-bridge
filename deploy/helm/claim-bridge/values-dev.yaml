global:
  imageTag: dev
  environment: Development
  publicIssuer: https://claims-dev.example.org/
  seed: true
ingress:
  host: claims-dev.example.org
keyVault:
  name: kv-claim-bridge-dev
config:
  kafkaBootstrap: claim-bridge-dev.servicebus.windows.net:9093
  redisHost: claim-bridge-dev.redis.cache.windows.net:6380,ssl=true
  sqlServer: sql-claim-bridge-dev.database.windows.net
services:
  identity:
    replicas: 1
    # Development falls back to ephemeral keys, which is fine for a single replica
    tokenKeysSecret: ""
    env:
      Auth__PortalRedirectUris__0: https://claims-dev.example.org/callback
      Auth__PortalPostLogoutUris__0: https://claims-dev.example.org/
  providers: { replicas: 1 }
  claims: { replicas: 1, hpa: { enabled: true, minReplicas: 1, maxReplicas: 3, cpu: 80 } }
  scrubber: { replicas: 1, hpa: { enabled: true, minReplicas: 1, maxReplicas: 3, cpu: 80 } }
  payers-gateway:
    replicas: 1
    env:
      Services__Claims: http://claim-bridge-claims:8080/
      Payers__PAYER-A__BaseUrl: http://claim-bridge-payer-sim:8080/
      Payers__PAYER-A__CallbackUrl: http://claim-bridge-payers-gateway:8080/api/payers/payer-a/callbacks/adjudication
      Payers__PAYER-B__BaseUrl: http://claim-bridge-payer-sim:8080/
      Payers__PAYER-C__BaseUrl: http://claim-bridge-payer-sim:8080/
  remittance: { replicas: 1 }
  notifications: { replicas: 1, hpa: { enabled: true, minReplicas: 1, maxReplicas: 3, cpu: 80 } }
  gateway: { replicas: 1 }
  portal: { replicas: 1 }
  # the simulator only ever runs in dev
  payer-sim: { enabled: true }
