{{- /*
  Only with the kubernetes secrets provider and no existingSecret. With localDependencies the values point at the
  in-cluster SQL Server, Redis and Azurite and come from localSecrets; otherwise they are REPLACE_ME placeholders.
  With the keyvault provider each pod mounts its secrets from Key Vault instead (secretproviderclass.yaml).
*/}}
{{- if and (eq .Values.providers.secrets "kubernetes") (not .Values.global.existingSecret) }}
{{- $local := .Values.localDependencies.enabled }}
{{- $sql := ternary (include "cb.localHost" (dict "root" $ "name" "sqlserver")) .Values.config.sqlServer $local }}
{{- $password := ternary .Values.localSecrets.servicePassword "REPLACE_ME" $local }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "cb.secretName" . }}
  labels:
    app.kubernetes.io/part-of: claim-bridge
type: Opaque
stringData:
  {{- range $name, $svc := .Values.services }}
  {{- if $svc.database }}
  {{- $login := printf "%s_svc" ($name | replace "-" "_" | replace "payers_gateway" "payers") }}
  {{- if $svc.python }}
  {{ $name }}-database-url: "mssql+pyodbc://{{ $login }}:{{ $password }}@{{ $sql }}:1433/{{ $svc.database }}?driver=ODBC+Driver+18+for+SQL+Server{{ if $local }}&TrustServerCertificate=yes{{ end }}"
  {{- else }}
  {{ $name }}-connection-string: "Server={{ $sql }};Database={{ $svc.database }};User Id={{ $login }};Password={{ $password }};{{ if $local }}TrustServerCertificate=True{{ else }}Encrypt=True{{ end }}"
  {{- end }}
  {{- end }}
  {{- end }}
  {{- if $local }}
  sa-password: {{ .Values.localSecrets.saPassword | quote }}
  redis-connection-string: "{{ include "cb.localHost" (dict "root" $ "name" "redis") }}:6379"
  blob-connection-string: "DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://{{ include "cb.localHost" (dict "root" $ "name" "azurite") }}:10000/devstoreaccount1;"
  phi-key: {{ required "localSecrets.phiKey is required: --set-file localSecrets.phiKey=<git-ignored key file>" .Values.localSecrets.phiKey | trim | quote }}
  payer-a-callback-token: {{ .Values.localSecrets.payerACallbackToken | quote }}
  {{- else }}
  redis-connection-string: "{{ .Values.config.redisHost }},password=REPLACE_ME"
  blob-connection-string: "DefaultEndpointsProtocol=https;AccountName=REPLACE_ME;AccountKey=REPLACE_ME;EndpointSuffix=core.windows.net"
  phi-key: "REPLACE_ME_BASE64_32_BYTES"
  payer-a-callback-token: "REPLACE_ME"
  {{- if eq .Values.providers.messaging "eventhubs" }}
  eventhubs-connection-string: "Endpoint=sb://REPLACE_ME.servicebus.windows.net/;SharedAccessKeyName=REPLACE_ME;SharedAccessKey=REPLACE_ME"
  {{- end }}
  {{- end }}
{{- end }}
