{{- /*
  Placeholder secret for environments without Key Vault integration. In prod global.existingSecret points at a
  secret synced from Key Vault (CSI driver), and this template renders nothing.
*/}}
{{- if not .Values.global.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "cb.secretName" . }}
  labels:
    app.kubernetes.io/part-of: claim-bridge
type: Opaque
stringData:
  {{- range $name, $svc := .Values.services }}
  {{- if $svc.database }}
  {{- if $svc.python }}
  {{ $name }}-database-url: "mssql+pyodbc://{{ $name | replace "-" "_" }}_svc:REPLACE_ME@{{ $.Values.config.sqlServer }}:1433/{{ $svc.database }}?driver=ODBC+Driver+18+for+SQL+Server"
  {{- else }}
  {{ $name }}-connection-string: "Server={{ $.Values.config.sqlServer }};Database={{ $svc.database }};User Id={{ $name | replace "-" "_" }}_svc;Password=REPLACE_ME;Encrypt=True"
  {{- end }}
  {{- end }}
  {{- end }}
  redis-connection-string: "{{ .Values.config.redisHost }},password=REPLACE_ME"
  blob-connection-string: "DefaultEndpointsProtocol=https;AccountName=REPLACE_ME;AccountKey=REPLACE_ME;EndpointSuffix=core.windows.net"
  phi-key: "REPLACE_ME_BASE64_32_BYTES"
  payer-a-callback-token: "REPLACE_ME"
{{- end }}
