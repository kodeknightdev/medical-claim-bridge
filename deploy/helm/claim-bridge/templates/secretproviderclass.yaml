{{- /*
  Key Vault secrets provider: each service mounts only its own secrets, written as files named after the setting
  they fill. Needs the AKS Key Vault CSI add-on; the identity is the add-on's user-assigned identity.
*/}}
{{- if eq .Values.providers.secrets "keyvault" }}
{{- range $name, $svc := .Values.services }}
{{- if and (eq (include "cb.enabled" $svc) "true") (not $svc.static) }}
{{- $ctx := dict "name" $name "root" $ }}
---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ include "cb.fullname" (dict "Release" $.Release "name" $name) }}
  labels: {{- include "cb.labels" $ctx | nindent 4 }}
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "true"
    userAssignedIdentityID: {{ required "keyVault.identityClientId is required with the keyvault secrets provider" $.Values.keyVault.identityClientId | quote }}
    keyvaultName: {{ required "keyVault.name is required with the keyvault secrets provider" $.Values.keyVault.name | quote }}
    tenantId: {{ required "keyVault.tenantId is required with the keyvault secrets provider" $.Values.keyVault.tenantId | quote }}
    objects: |
      array:
        {{- range include "cb.secretRefs" (dict "name" $name "svc" $svc "root" $) | fromYamlArray }}
        - |
          objectName: {{ .key }}
          objectType: secret
          objectAlias: {{ .file }}
        {{- end }}
{{- end }}
{{- end }}
{{- end }}
