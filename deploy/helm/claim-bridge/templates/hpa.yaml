{{- range $name, $svc := .Values.services }}
{{- if and (eq (include "cb.enabled" $svc) "true") $svc.hpa $svc.hpa.enabled }}
{{- $ctx := dict "name" $name "root" $ }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "cb.fullname" (dict "Release" $.Release "name" $name) }}
  labels: {{- include "cb.labels" $ctx | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "cb.fullname" (dict "Release" $.Release "name" $name) }}
  minReplicas: {{ $svc.hpa.minReplicas }}
  maxReplicas: {{ $svc.hpa.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: {{ $svc.hpa.cpu }} }
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
{{- end }}
{{- end }}
