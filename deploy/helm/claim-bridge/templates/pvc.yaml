{{- range $name, $svc := .Values.services }}
{{- if and (eq (include "cb.enabled" $svc) "true") $svc.modelStorage }}
{{- $ctx := dict "name" $name "root" $ }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "cb.fullname" (dict "Release" $.Release "name" $name) }}-models
  labels: {{- include "cb.labels" $ctx | nindent 4 }}
spec:
  accessModes: [ReadWriteOnce]
  {{- with $svc.modelStorage.storageClass }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ $svc.modelStorage.size }}
{{- end }}
{{- end }}
