{{- /*
  In-cluster stand-ins for the Azure services, for clusters without Azure (kind, Docker Desktop): SQL Server instead
  of Azure SQL, Kafka instead of Event Hubs, Redis, Azurite instead of Storage and SFTP, MailHog for SMTP. Same images
  and init scripts as docker-compose. Data lives in emptyDir volumes and is lost when a pod restarts.
*/}}
{{- if .Values.localDependencies.enabled }}
{{- $deps := .Values.localDependencies }}
{{- $secret := include "cb.secretName" . }}
{{- $sql := include "cb.localHost" (dict "root" $ "name" "sqlserver") }}
{{- $kafka := include "cb.localHost" (dict "root" $ "name" "kafka") }}
{{- range $dep := list
      (dict "name" "sqlserver" "image" $deps.images.sqlserver "port" 1433 "data" "/var/opt/mssql")
      (dict "name" "kafka" "image" $deps.images.kafka "port" 9092 "data" "/var/lib/kafka/data")
      (dict "name" "redis" "image" $deps.images.redis "port" 6379 "args" (list "redis-server" "--save" "" "--appendonly" "no"))
      (dict "name" "azurite" "image" $deps.images.azurite "port" 10000 "data" "/data"
            "args" (list "azurite-blob" "--blobHost" "0.0.0.0" "--blobLocation" "/data" "--skipApiVersionCheck" "--loose"))
      (dict "name" "mailhog" "image" $deps.images.mailhog "port" 1025) }}
{{- $full := include "cb.localHost" (dict "root" $ "name" $dep.name) }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $full }}
  labels:
    app.kubernetes.io/name: {{ $dep.name }}
    app.kubernetes.io/instance: {{ $.Release.Name }}
    app.kubernetes.io/component: local-dependency
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app.kubernetes.io/name: {{ $dep.name }}, app.kubernetes.io/instance: {{ $.Release.Name }} }
  template:
    metadata:
      labels: { app.kubernetes.io/name: {{ $dep.name }}, app.kubernetes.io/instance: {{ $.Release.Name }} }
    spec:
      containers:
        - name: {{ $dep.name }}
          image: {{ $dep.image }}
          {{- with $dep.args }}
          args: {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - containerPort: {{ $dep.port }}
          {{- if eq $dep.name "sqlserver" }}
          env:
            - { name: ACCEPT_EULA, value: "Y" }
            - { name: MSSQL_PID, value: Developer }
            - name: MSSQL_SA_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ $secret }}, key: sa-password } }
          {{- else if eq $dep.name "kafka" }}
          env:
            - { name: KAFKA_NODE_ID, value: "1" }
            - { name: KAFKA_PROCESS_ROLES, value: "broker,controller" }
            - { name: KAFKA_LISTENERS, value: "PLAINTEXT://:9092,CONTROLLER://:9093" }
            - { name: KAFKA_ADVERTISED_LISTENERS, value: "PLAINTEXT://{{ $kafka }}:9092" }
            - { name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP, value: "PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT" }
            - { name: KAFKA_CONTROLLER_LISTENER_NAMES, value: CONTROLLER }
            - { name: KAFKA_CONTROLLER_QUORUM_VOTERS, value: "1@localhost:9093" }
            - { name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR, value: "1" }
            - { name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR, value: "1" }
            - { name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR, value: "1" }
            - { name: KAFKA_AUTO_CREATE_TOPICS_ENABLE, value: "false" }
          {{- end }}
          {{- with $dep.data }}
          volumeMounts:
            - { name: data, mountPath: {{ . }} }
          {{- end }}
      {{- if $dep.data }}
      volumes:
        - { name: data, emptyDir: {} }
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $full }}
  labels: { app.kubernetes.io/name: {{ $dep.name }}, app.kubernetes.io/instance: {{ $.Release.Name }} }
spec:
  selector: { app.kubernetes.io/name: {{ $dep.name }}, app.kubernetes.io/instance: {{ $.Release.Name }} }
  ports:
    - { port: {{ $dep.port }}, targetPort: {{ $dep.port }} }
{{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $.Release.Name }}-init-scripts
  labels: { app.kubernetes.io/instance: {{ $.Release.Name }}, app.kubernetes.io/component: local-dependency }
data:
  sqlserver-init.sh: {{ $.Files.Get "files/sqlserver-init.sh" | quote }}
  kafka-create-topics.sh: {{ $.Files.Get "files/kafka-create-topics.sh" | quote }}
{{- range $job := list
      (dict "name" "sqlserver-init" "image" $deps.images.sqlserver "script" "sqlserver-init.sh")
      (dict "name" "kafka-topics" "image" $deps.images.kafka "script" "kafka-create-topics.sh") }}
---
apiVersion: batch/v1
kind: Job
metadata:
  # the release revision in the name lets an upgrade run the idempotent script again
  name: {{ $.Release.Name }}-{{ $job.name }}-{{ $.Release.Revision }}
  labels: { app.kubernetes.io/instance: {{ $.Release.Name }}, app.kubernetes.io/component: local-dependency }
spec:
  backoffLimit: 10
  ttlSecondsAfterFinished: 600
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: {{ $job.name }}
          image: {{ $job.image }}
          command: ["/bin/bash", "/init/{{ $job.script }}"]
          env:
            - { name: SQL_HOST, value: {{ $sql }} }
            - { name: KAFKA_BOOTSTRAP, value: "{{ $kafka }}:9092" }
            - name: MSSQL_SA_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ $secret }}, key: sa-password, optional: true } }
            - { name: SERVICE_DB_PASSWORD, value: {{ $.Values.localSecrets.servicePassword | quote }} }
          volumeMounts:
            - { name: scripts, mountPath: /init }
      volumes:
        - name: scripts
          configMap: { name: {{ $.Release.Name }}-init-scripts }
{{- end }}
{{- end }}
