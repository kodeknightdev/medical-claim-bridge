{{- range $name, $svc := .Values.services }}
{{- if eq (include "cb.enabled" $svc) "true" }}
{{- $ctx := dict "name" $name "root" $ }}
{{- $full := include "cb.fullname" (dict "Release" $.Release "name" $name) }}
{{- $secret := include "cb.secretName" $ }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $full }}
  labels: {{- include "cb.labels" $ctx | nindent 4 }}
    {{- if $svc.externalEgress }}
    claim-bridge/egress: external
    {{- end }}
spec:
  {{- if not (and $svc.hpa $svc.hpa.enabled) }}
  replicas: {{ $svc.replicas }}
  {{- end }}
  revisionHistoryLimit: 3
  {{- if $svc.modelStorage }}
  strategy: { type: Recreate }
  {{- end }}
  selector:
    matchLabels: {{- include "cb.selector" $ctx | nindent 6 }}
  template:
    metadata:
      labels: {{- include "cb.selector" $ctx | nindent 8 }}
        {{- if $svc.externalEgress }}
        claim-bridge/egress: external
        {{- end }}
        {{- if $svc.ingress }}
        claim-bridge/ingress: public
        {{- end }}
      annotations:
        {{- if not $svc.static }}
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") $ | sha256sum }}
        {{- end }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: {{ $name }}
          image: {{ include "cb.image" (dict "root" $ "svc" $svc) }}
          imagePullPolicy: {{ $.Values.global.imagePullPolicy }}
          ports:
            - { name: http, containerPort: {{ $svc.port }} }
            {{- if $svc.grpcPort }}
            - { name: grpc, containerPort: {{ $svc.grpcPort }} }
            {{- end }}
          {{- if not $svc.static }}
          envFrom:
            - configMapRef:
                name: {{ $full }}
          env:
            {{- if eq $.Values.providers.secrets "kubernetes" }}
            {{- range include "cb.secretRefs" (dict "name" $name "svc" $svc "root" $) | fromYamlArray }}
            - name: {{ .env }}
              valueFrom: { secretKeyRef: { name: {{ $secret }}, key: {{ .key }} } }
            {{- end }}
            {{- end }}
            {{- if $svc.tokenKeysSecret }}
            - { name: Auth__Keys__SigningCertificatePath, value: /keys/signing.pfx }
            - { name: Auth__Keys__EncryptionCertificatePath, value: /keys/encryption.pfx }
            - name: Auth__Keys__CertificatePassword
              valueFrom: { secretKeyRef: { name: {{ $svc.tokenKeysSecret }}, key: password } }
            {{- end }}
          {{- end }}
          readinessProbe:
            httpGet: { path: {{ if $svc.static }}/{{ else }}/health{{ end }}, port: http }
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet: { path: {{ if $svc.static }}/{{ else }}/alive{{ end }}, port: http }
            initialDelaySeconds: 20
            periodSeconds: 20
          resources: {{- toYaml $svc.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: {{ not $svc.static }}
            capabilities: { drop: [ALL] }
          {{- if or $svc.python (not $svc.static) }}
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            {{- if $svc.python }}
            - { name: models, mountPath: /app/models }
            {{- end }}
            {{- if $svc.tokenKeysSecret }}
            - { name: token-keys, mountPath: /keys, readOnly: true }
            {{- end }}
            {{- if and (eq $.Values.providers.secrets "keyvault") (not $svc.static) }}
            - { name: secrets-store, mountPath: /mnt/secrets-store, readOnly: true }
            {{- end }}
          {{- end }}
      {{- if or $svc.python (not $svc.static) }}
      volumes:
        - { name: tmp, emptyDir: {} }
        {{- if and (eq $.Values.providers.secrets "keyvault") (not $svc.static) }}
        - name: secrets-store
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes: { secretProviderClass: {{ $full }} }
        {{- end }}
        {{- if $svc.tokenKeysSecret }}
        - name: token-keys
          secret:
            secretName: {{ $svc.tokenKeysSecret }}
            items: [{ key: signing.pfx, path: signing.pfx }, { key: encryption.pfx, path: encryption.pfx }]
        {{- end }}
        {{- if $svc.modelStorage }}
        - name: models
          persistentVolumeClaim: { claimName: {{ $full }}-models }
        {{- else if $svc.python }}
        - { name: models, emptyDir: {} }
        {{- end }}
      {{- end }}
{{- end }}
{{- end }}
