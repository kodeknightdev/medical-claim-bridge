# Shared defaults. values-dev.yaml / values-prod.yaml layer environment specifics on top.
global:
  imageRegistry: claimbridgeacr.azurecr.io
  imageTag: "1.0.0"
  imagePullPolicy: IfNotPresent
  publicIssuer: https://claims.example.org/
  environment: Production
  otlpEndpoint: http://otel-collector.observability:4317
  # with the kubernetes secrets provider: name of a pre-created Secret; empty renders a placeholder (or local) one
  existingSecret: ""
  # seeds demo users, practices, payer rules and code sets on start (dev and local only)
  seed: false
  # defaults to https://<ingress.host>
  corsOrigin: ""

# How each Azure-only integration is satisfied. The services default to the local options; these defaults describe
# an Azure deployment whose resources already exist, whether Terraform created them or not.
providers:
  messaging: eventhubs   # kafka | eventhubs
  storage: azure         # local | azure
  secrets: keyvault      # kubernetes | keyvault

# Used by the keyvault secrets provider (SecretProviderClass per service).
keyVault:
  name: kv-claim-bridge
  tenantId: 00000000-0000-0000-0000-000000000000
  # client id of the AKS Key Vault secrets provider identity (Terraform output key_vault_identity_client_id)
  identityClientId: 00000000-0000-0000-0000-000000000000

# In-cluster SQL Server, Kafka, Redis, Azurite and MailHog instead of Azure services (values-local.yaml).
localDependencies:
  enabled: false
  images:
    sqlserver: mcr.microsoft.com/mssql/server:2022-CU17-ubuntu-22.04
    kafka: apache/kafka:3.9.0
    redis: redis:7.4.2-alpine
    azurite: mcr.microsoft.com/azure-storage/azurite:3.34.0
    mailhog: mailhog/mailhog:v1.0.1

# Only read with localDependencies; development values, never real ones.
localSecrets:
  saPassword: ""
  servicePassword: ""
  payerACallbackToken: ""
  # pass with --set-file localSecrets.phiKey=<git-ignored key file>
  phiKey: ""

ingress:
  enabled: true
  className: nginx
  host: claims.example.org
  tls:
    enabled: true
    secretName: claim-bridge-tls

networkPolicies:
  enabled: true
  ingressControllerNamespace: ingress-nginx

# Connection settings rendered into each service's ConfigMap; secret values come from the Secret.
config:
  kafkaBootstrap: kafka.example.servicebus.windows.net:9093
  redisHost: claim-bridge.redis.cache.windows.net:6380,ssl=true
  sqlServer: sql-claim-bridge.database.windows.net

services:
  identity:
    image: identity
    port: 8080
    replicas: 2
    database: cb_identity
    # secret holding signing.pfx, encryption.pfx and password; required when replicas > 1 or outside Development
    tokenKeysSecret: claim-bridge-identity-keys
    resources: { requests: { cpu: 100m, memory: 192Mi }, limits: { cpu: "1", memory: 512Mi } }
    env:
      Auth__PortalRedirectUris__0: https://claims.example.org/callback
      Auth__PortalPostLogoutUris__0: https://claims.example.org/
  providers:
    image: providers
    port: 8080
    replicas: 2
    database: cb_providers
    resources: { requests: { cpu: 100m, memory: 192Mi }, limits: { cpu: "1", memory: 512Mi } }
  claims:
    image: claims
    port: 8080
    replicas: 2
    database: cb_claims
    hpa: { enabled: true, minReplicas: 2, maxReplicas: 8, cpu: 70 }
    resources: { requests: { cpu: 200m, memory: 256Mi }, limits: { cpu: "2", memory: 768Mi } }
    env:
      Services__ScrubberGrpc: http://claim-bridge-scrubber:8081
      Services__Providers: http://claim-bridge-providers:8080/
      Services__PayersGateway: http://claim-bridge-payers-gateway:8080/
      Services__DenialPredictor: http://claim-bridge-denial-predictor:8000/
  scrubber:
    image: scrubber
    port: 8080
    grpcPort: 8081
    replicas: 2
    database: cb_scrubber
    hpa: { enabled: true, minReplicas: 2, maxReplicas: 6, cpu: 70 }
    resources: { requests: { cpu: 200m, memory: 256Mi }, limits: { cpu: "2", memory: 512Mi } }
  payers-gateway:
    image: payers-gateway
    port: 8080
    replicas: 2
    database: cb_payers
    externalEgress: true
    resources: { requests: { cpu: 200m, memory: 256Mi }, limits: { cpu: "2", memory: 768Mi } }
    env:
      Services__Claims: http://claim-bridge-claims:8080/
      Payers__PAYER-A__BaseUrl: https://api.northwind.example/
      Payers__PAYER-A__CallbackUrl: https://claims.example.org/api/payers/payer-a/callbacks/adjudication
      Payers__PAYER-B__BaseUrl: https://edi.bluepeak.example/
      Payers__PAYER-C__BaseUrl: https://claims.cascade.example/
  remittance:
    image: remittance
    port: 8080
    replicas: 2
    database: cb_remittance
    resources: { requests: { cpu: 100m, memory: 256Mi }, limits: { cpu: "1", memory: 768Mi } }
  notifications:
    image: notifications
    port: 8080
    replicas: 2
    database: cb_notifications
    externalEgress: true
    hpa: { enabled: true, minReplicas: 2, maxReplicas: 6, cpu: 70 }
    resources: { requests: { cpu: 100m, memory: 192Mi }, limits: { cpu: "1", memory: 512Mi } }
    env:
      Services__Providers: http://claim-bridge-providers:8080/
      Smtp__Host: smtp.example.org
      Smtp__Port: "587"
  denial-predictor:
    image: denial-predictor
    port: 8000
    replicas: 1
    python: true
    database: cb_denial_predictor
    # trained model files must survive restarts; one replica because the volume is ReadWriteOnce
    modelStorage: { size: 2Gi, storageClass: "" }
    resources: { requests: { cpu: 250m, memory: 512Mi }, limits: { cpu: "2", memory: 1536Mi } }
  analytics:
    image: analytics
    port: 8000
    replicas: 1
    python: true
    database: cb_analytics
    resources: { requests: { cpu: 200m, memory: 512Mi }, limits: { cpu: "1", memory: 1Gi } }
    env:
      PAYERS_GATEWAY_URL: http://claim-bridge-payers-gateway:8080/
  gateway:
    image: gateway
    port: 8080
    replicas: 2
    ingress: true
    resources: { requests: { cpu: 200m, memory: 192Mi }, limits: { cpu: "2", memory: 512Mi } }
  portal:
    image: portal
    port: 8080
    replicas: 2
    static: true
    ingress: true
    resources: { requests: { cpu: 50m, memory: 32Mi }, limits: { cpu: 250m, memory: 128Mi } }
  payer-sim:
    enabled: false
    image: payer-sim
    port: 8080
    replicas: 1
    env:
      Sim__NorthwindCallbackUrl: http://claim-bridge-payers-gateway:8080/api/payers/payer-a/callbacks/adjudication
    resources: { requests: { cpu: 50m, memory: 128Mi }, limits: { cpu: 500m, memory: 256Mi } }

cronJobs:
  modelRetraining:
    schedule: "0 3 * * 0"
    target: http://claim-bridge-denial-predictor:8000/internal/train
  arSnapshot:
    schedule: "15 2 * * *"
    target: http://claim-bridge-remittance:8080/internal/jobs/ar-snapshot
  image: curlimages/curl:8.12.1
