parameters:
  - name: images
    type: object

jobs:
  - ${{ each image in parameters.images }}:
      - job: Image_${{ replace(image.name, '-', '_') }}
        displayName: Image ${{ image.name }}
        pool: { vmImage: ubuntu-24.04 }
        # path filter: rebuild when this component or shared code changed
        condition: or(contains(variables['changes'], '${{ image.paths }}'), contains(variables['changes'], 'all'))
        steps:
          - task: Docker@2
            displayName: Build and push ${{ image.name }}
            inputs:
              containerRegistry: acr-connection
              repository: claim-bridge/${{ image.name }}
              command: buildAndPush
              Dockerfile: ${{ image.dockerfile }}
              buildContext: ${{ image.context }}
              tags: |
                $(imageTag)
                main
