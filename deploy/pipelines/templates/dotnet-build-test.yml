jobs:
  - job: Dotnet
    displayName: .NET build and test
    pool: { vmImage: ubuntu-24.04 }
    steps:
      - task: UseDotNet@2
        inputs: { packageType: sdk, useGlobalJson: true }
      - script: dotnet restore ClaimBridge.sln --locked-mode
        displayName: Restore (locked)
      - script: dotnet build ClaimBridge.sln -c Release --no-restore -warnaserror:NU1605
        displayName: Build
      # Testcontainers needs the hosted agent's Docker daemon (available on ubuntu images)
      - script: dotnet test ClaimBridge.sln -c Release --no-build --logger trx --collect "XPlat Code Coverage" --results-directory $(Agent.TempDirectory)/tests
        displayName: Test (unit, snapshot, WireMock, Testcontainers)
      - task: PublishTestResults@2
        condition: succeededOrFailed()
        inputs: { testResultsFormat: VSTest, testResultsFiles: "$(Agent.TempDirectory)/tests/**/*.trx" }
      - task: PublishCodeCoverageResults@2
        condition: succeededOrFailed()
        inputs: { summaryFileLocation: "$(Agent.TempDirectory)/tests/**/coverage.cobertura.xml" }
